plugins {
    id 'java'
    id 'application'
}

application {
    mainClass = 'io.github.vinhphan812.mcp.examples.HttpExample'
}

def sdkJar = project.findProperty('sdkJar') != null
        ? project.property('sdkJar')
        : '../build/libs/mcp-java-sdk-1.0-SNAPSHOT.jar'

repositories {
    mavenCentral()
}

dependencies {
    implementation files(sdkJar)

    // The SDK is consumed as a local JAR in this standalone examples build.
    // Mirror its runtime dependency graph so conformanceClasspath can boot the
    // fixture without NoClassDefFoundError at CI runtime.
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'com.networknt:json-schema-validator:1.5.0'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'
    implementation 'org.glassfish.grizzly:grizzly-http-server:4.0.2'
    implementation 'com.google.guava:guava:33.3.0-jre'
}

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

// Produces a file at examples/build/conformance-classpath.txt containing the full
// classpath needed to run the ConformanceFixture (SDK JAR + examples classes).
// The conformance CI job reads this file and passes it to `java -cp`.
tasks.register('conformanceClasspath') {
    description = 'Compile examples and emit the fixture classpath to examples/build/conformance-classpath.txt'
    group = 'build'
    dependsOn classes

    doLast {
        // runtimeClasspath contains fixture classes, the local SDK JAR, and the
        // explicitly declared SDK runtime dependency graph above.
        def classpath = sourceSets.main.runtimeClasspath.asPath
        def outFile = new File(project.buildDir, 'conformance-classpath.txt')
        outFile.parentFile.mkdirs()
        outFile.text = classpath
        println "Wrote conformance classpath (${outFile.length()} bytes)"
    }
}
