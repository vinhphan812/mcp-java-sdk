plugins {
    id 'java'
    id 'application'
}

application {
    mainClass = 'io.github.vinhphan812.mcp.examples.HttpExample'
}

repositories {
    mavenCentral()
}

dependencies {
    // Compile against the main project's compiled classes directory.
    // Gradle automatically adds a task dependency on main:classes when using
    // files() that point inside the root project's build/ directory.
    implementation files('../build/classes/java/main')

    // The SDK's runtime dependency graph (needed at fixture boot time, not compile time).
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'org.glassfish.grizzly:grizzly-http-server:4.0.2'
    implementation 'com.google.guava:guava:33.3.0-jre'
}

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

// Produces a file at examples/build/conformance-classpath.txt containing the full
// classpath needed to run the ConformanceFixture (SDK classes + examples classes +
// SDK runtime deps).
// The conformance CI job reads this file and passes it to `java -cp`.
tasks.register('conformanceClasspath') {
    description = 'Compile examples and emit the fixture classpath to examples/build/conformance-classpath.txt'
    group = 'build'
    dependsOn classes

    doLast {
        // Build the classpath from the main project's compiled classes,
        // this project's compiled classes, and the explicitly declared runtime deps.
        def mainClasses = rootProject.layout.buildDirectory
                .dir('classes/java/main').get().asFile
        def thisClasses = project.layout.buildDirectory
                .dir('classes/java/main').get().asFile
        def runtimeDeps = sourceSets.main.runtimeClasspath.files
        def classpath = ([mainClasses, thisClasses] + runtimeDeps).join(java.io.File.pathSeparator)
        def outFile = new File(project.buildDir, 'conformance-classpath.txt')
        outFile.parentFile.mkdirs()
        outFile.text = classpath
        println "Wrote conformance classpath (${outFile.length()} bytes)"
    }
}
