plugins {
    id 'java'
    id 'maven-publish'
    // CycloneDX software bill-of-materials (SBOM)
    id 'org.cyclonedx.bom' version '1.10.0'
}

// Release tags (for example v1.2.3) publish as 1.2.3. sdkVersion is
// available for local/reproducible builds without changing this file.
def releaseVersion = System.getenv('GITHUB_REF_NAME')?.with { ref ->
    ref.startsWith('v') ? ref.substring(1) : null
}
def sdkVersion = providers.gradleProperty('sdkVersion').orElse(releaseVersion ?: '1.0-SNAPSHOT').get()

cyclonedxBom {
    // Include runtimeClasspath to capture all transitive implementation dependencies.
    includeConfigs = ['runtimeClasspath']
    // Output JSON (CycloneDX schema 1.5, per v1.10.x plugin capabilities).
    outputFormat = 'json'
    schemaVersion = '1.5'
}

group = 'io.github.vinhphan812.mcp'
version = sdkVersion

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
    withSourcesJar()
    withJavadocJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:unchecked']
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.google.code.gson:gson:2.11.0'

    /*
     * Grizzly 4.0.2 is compiled for Java 11 bytecode and establishes the
     * published SDK's Java 11 runtime floor. The transport sanitises response
     * headers and SSE data before emission. Reassess this dependency before a release.
     */
    implementation 'org.glassfish.grizzly:grizzly-http-server:4.0.2'

    implementation 'com.google.guava:guava:33.3.0-jre'

    // ── JWT / JOSE (MIT licence, Android-compatible) ──────────────────────────────
    // jjwt-api:    provider-neutral JWT parser/builder API (compileOnly → included in
    //              published JAR so callers can type-annotate against it; the impl
    //              is a runtime dependency of the consuming application, not the SDK)
    // jjwt-impl:   reference implementation of the parser/builder; pulled in as
    //              runtimeOnly so it is not part of the SDK JAR but is available at
    //              test/runtime.  Its transitive dep jjwt-jackson brings in
    //              jackson-databind which is excluded from the SDK core — it lives
    //              only in the consuming application's classpath.
    //              Android note: for Android use the android-jwt split (separate impl
    //              modules for J2SE, Android) if jackson-databind is unavailable.
    // jjwt-api:    provider-neutral JWT parser/builder API.
    //              compileOnly for the main source (SDK JAR does not bundle it).
    //              testImplementation so the test suite can also compile against it.
    // jjwt-impl:   reference implementation; runtimeOnly for main source
    //              (compileOnly SDK pattern) and testRuntimeOnly so the test
    //              JVM can actually run the parser at test time.
    //              Its transitive dep jjwt-jackson is excluded so that only
    //              jjwt-gson (Gson-based JSON) is available — avoiding a conflict
    //              with the SDK's own Gson dependency and the json-schema-validator
    //              transitive dep on jackson-databind.
    compileOnly 'io.jsonwebtoken:jjwt-api:0.12.6'
    testImplementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly('io.jsonwebtoken:jjwt-impl:0.12.6') {
        exclude group: 'io.jsonwebtoken', module: 'jjwt-jackson'
    }
    // jjwt-gson:   Gson-based JSON serializer for jjwt-impl (required when
    //              jjwt-jackson is excluded).  Gson is already a transitive dep
    //              of the SDK via com.google.code.gson:gson.
    testRuntimeOnly 'io.jsonwebtoken:jjwt-gson:0.12.6'
    testRuntimeOnly('io.jsonwebtoken:jjwt-impl:0.12.6') {
        exclude group: 'io.jsonwebtoken', module: 'jjwt-jackson'
    }

    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            pom {
                name = 'MCP Java SDK'
                description = 'Portable Java MCP protocol core with optional Grizzly Streamable HTTP transport'
                url = 'https://github.com/vinhphan812/mcp-java-sdk'
                licenses {
                    license {
                        name = 'Apache License, Version 2.0'
                        url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                        distribution = 'repo'
                    }
                }
                scm {
                    url = 'https://github.com/vinhphan812/mcp-java-sdk'
                    connection = 'scm:git:https://github.com/vinhphan812/mcp-java-sdk.git'
                    developerConnection = 'scm:git:ssh://git@github.com/vinhphan812/mcp-java-sdk.git'
                }
            }
        }
    }
    repositories {
        maven {
            name = 'GitHubPackages'
            url = uri('https://maven.pkg.github.com/vinhphan812/mcp-java-sdk')
            credentials {
                username = findProperty('gpr.user') ?: System.getenv('GITHUB_ACTOR')
                password = findProperty('gpr.key') ?: System.getenv('GITHUB_TOKEN')
            }
        }
    }
}
