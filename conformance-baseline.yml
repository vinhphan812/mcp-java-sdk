# MCP Conformance Baseline — Known Failures
#
# This file tracks known conformance test failures. When a baseline entry passes,
# it becomes a regression — the test run FAILS until the entry is removed.
# This is the inverse of most CI: passing a known failure is flagged as a regression.
#
# Updated: 2026-10-03
# Tool: npx @modelcontextprotocol/conformance@latest
#
# Expected format (flat array per mode):
#   server:
#     - scenario-name-1
#     - scenario-name-2
#
# See: https://github.com/modelcontextprotocol/conformance/blob/main/README.md

# ── Active suite (2025-11-25) ─────────────────────────────────────────────
server:
  # Elicitation (SEP-2322) is not yet implemented in the SDK.
  # Remove these entries when elicitation is added (see ADR-0022).
  - elicitation-sep1034-defaults
  - elicitation-sep1330-enums
  - tools-call-elicitation
  - tools-call-sampling

  # SSE reconnect respects retry hint (2025-11-25); SDK reconnects immediately.
  # This is a SHOULD requirement; no plan to fix without explicit requirement.
  - server-sse-multiple-streams

# ── Draft suite (2026-07-28) ─────────────────────────────────────────────
# NOTE: spec-version 2026-07-28 is rejected by @modelcontextprotocol/conformance@0.1.16
# Valid spec versions: 2025-03-26, 2025-06-18, 2025-11-25, draft, extension
# When draft suite is supported, add elicitation expected-failures here.
# See GitHub issue #4 for tracking.

# ── Auth suite ────────────────────────────────────────────────────────────
# OAuth resource-server is a deployment-layer concern, not an SDK concern.
auth: []
