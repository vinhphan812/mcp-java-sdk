name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  validate-docs:
    name: Validate Documentation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Validate Markdown tables and links
        run: python validate_docs.py
      - name: Check stale class references in docs
        run: python docs_check_stale_classes.py

  build:
    strategy:
      matrix:
        java-version: ['11', '17']
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Build SDK classes
        run: ./gradlew jar --console=plain

      - name: Compile examples (CI gate)
        run: ./gradlew --no-daemon -p examples compileJava --console=plain

      - name: Test
        run: ./gradlew test --console=plain
      - name: Upload JAR artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mcp-java-sdk-artifacts
          path: build/libs/mcp-java-sdk-*.jar
          if-no-files-found: error

  dependency-security:
    name: SBOM and dependency vulnerability gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Generate CycloneDX SBOM
        run: ./gradlew cyclonedxBom --console=plain
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: cyclonedx-sbom
          path: build/reports/bom.json
          if-no-files-found: error
      # Install grype v0.97.1. The runner does not have it pre-installed.
      - name: Install grype SBOM scanner
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /tmp/grype-bin v0.97.1
          echo "/tmp/grype-bin" >> $GITHUB_PATH
      # NOTE: grype v0.97.1 only has --fail-on for severity gating (no --severity flag);
      # valid values: negligible | low | medium | high | critical.
      #
      # Step layout (all separate so one failure cannot suppress SARIF):
      # 1. Report findings (table + MEDIUM count) — non-blocking (--fail-on=high leaves MEDIUM at exit 0).
      # 2. Gate - block HIGH/CRITICAL per docs/SECURITY.md § Severity Policy.
      # 3. Generate SARIF - always succeeds (no --fail-on) so grype-results.sarif is produced
      #    even when findings are below threshold.
      # 4. Verify SARIF file exists and set an output so the upload runs only when present.
      # 5. Upload SARIF to GitHub code scanning — runs only if grype-results.sarif exists.
      - name: Scan SBOM - report MEDIUM findings
        run: |
          set +e
          # MEDIUM findings do not fail --fail-on=high; table shows HIGH+ findings.
          grype "build/reports/bom.json" --fail-on=high -o table
          # Count MEDIUM findings from grype JSON output for logging.
          grype "build/reports/bom.json" -o json | grep -c '"severity":"Medium"' || true
      - name: Gate - block HIGH or CRITICAL vulnerabilities
        run: |
          set +e
          # Exit 0 = clean; exit 1 = HIGH/CRITICAL found (per SECURITY.md § Severity Policy).
          grype "build/reports/bom.json" --fail-on=high
          rc=$?
          if [ $rc -eq 1 ]; then
            echo "HIGH or CRITICAL vulnerabilities detected - blocking build."
            exit 1
          fi
      - name: Generate SARIF for dependency scan
        if: always()
        run: |
          # No --fail-on: always exits 0 and writes grype-results.sarif, even when
          # findings are below threshold.
          grype "build/reports/bom.json" -o sarif --file grype-results.sarif
      - name: Check SARIF file exists
        if: always()
        id: sarif-check
        run: |
          if [ -f "grype-results.sarif" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "SARIF file exists, proceeding with upload"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "WARNING: grype-results.sarif not found"
          fi
      - name: Upload dependency scan SARIF
        if: always() && steps.sarif-check.outputs.exists == 'true'
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: grype-results.sarif

  # ── Official MCP 2026-07-28 conformance gate ─────────────────────────────────
  #
  # Uses `@modelcontextprotocol/conformance` (Node.js, CI-only — not a runtime dep).
  #
  # Strategy:
  #   1. Download the runtime JAR produced by the `build` job so we do not re-build.
  #   2. Compile only the ConformanceFixture test class against that JAR.
  #   3. Boot the fixture on ephemeral port 0; capture its base URL from stdout.
  #   4. Run `npx @modelcontextprotocol/conformance server --url <url> --spec-version 2026-07-28`.
  #   5. Exit code 0 only when every *required* scenario passes.
  #
  # Extension handling (MCP 2026-07-28 § SEP-1730):
  #   Tasks, elicitation, sampling, roots, logging are OPTIONAL — known gaps are listed
  #   in conformance-baseline.yml. A scenario that passes is always a pass; a scenario
  #   that fails but is in the baseline exits 0; a scenario that fails and is NOT in
  #   the baseline causes exit 1 (regression).
  #
  # STDIO is out of scope for this SDK (HTTP/SSE only). The runner tests Streamable HTTP.
  conformance:
    name: MCP 2026-07-28 conformance
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Download the JAR from the build job artifact (Java 17 build).
      - name: Download runtime JAR
        uses: actions/download-artifact@v4
        with:
          name: mcp-java-sdk-artifacts
          path: build/libs

      - name: Verify JAR downloaded
        run: |
          JAR=$(ls build/libs/mcp-java-sdk-*.jar | head -1)
          echo "JAR=$JAR"
          if [ -z "$JAR" ]; then
            echo "ERROR: No JAR found in build/libs" >&2
            exit 1
          fi
          echo "JAR_SIZE=$(stat -c%s "$JAR")" >> $GITHUB_OUTPUT
        id: jar-info

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      # Compile examples (includes ConformanceFixture) and produce the fixture classpath.
      - name: Build examples and generate fixture classpath
        run: |
          ./gradlew --no-daemon -p examples compileJava conformanceClasspath --console=plain

      # Set up Node (required by the conformance runner only — CI-only tooling).
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # Pin the conformance package to the exact version used in this SDK's reference CI run.
      # Bump this SHA when the conformance suite adds a regression for our implementation,
      # or when a new spec revision becomes the stable release target.
      - name: Install conformance runner
        run: npm install --no-save @modelcontextprotocol/conformance@latest

      # Boot the fixture in the background, capture the URL, then run conformance.
      # The fixture prints "CONFORMANCE_FIXTURE_URL=<url>" on stdout; we grep for it.
      - name: Run conformance suite
        run: |
          # Read the full classpath produced by the Gradle task.
          CP_FILE=examples/build/conformance-classpath.txt
          if [ ! -f "$CP_FILE" ]; then
            echo "ERROR: $CP_FILE not found (run conformanceClasspath Gradle task first)" >&2
            exit 1
          fi
          FIXTURE_CP=$(cat "$CP_FILE")

          # Start fixture in background.
          java -cp "$FIXTURE_CP" io.github.vinhphan812.mcp.ConformanceFixture \
            > /tmp/fixture.log 2>&1 &
          FIXTURE_PID=$!
          echo "Fixture PID: $FIXTURE_PID"

          # Wait for the URL to appear in stdout (max 20 s).
          FIXTURE_URL=""
          for i in $(seq 1 40); do
            FIXTURE_URL=$(grep '^CONFORMANCE_FIXTURE_URL=' /tmp/fixture.log | head -1 | cut -d= -f2-)
            if [ -n "$FIXTURE_URL" ]; then
              echo "Fixture URL: $FIXTURE_URL"
              break
            fi
            if ! kill -0 $FIXTURE_PID 2>/dev/null; then
              echo "ERROR: Fixture process exited unexpectedly:" >&2
              cat /tmp/fixture.log >&2
              exit 1
            fi
            sleep 0.5
          done

          if [ -z "$FIXTURE_URL" ]; then
            echo "ERROR: Timed out waiting for fixture URL" >&2
            cat /tmp/fixture.log >&2
            kill $FIXTURE_PID 2>/dev/null || true
            exit 1
          fi

          # Run the conformance suite.
          # --spec-version 2026-07-28 targets the stateless-lifecycle wire for this spec.
          # --expected-failures uses the per-scenario baseline: known gaps exit 0,
          #   unexpected failures exit 1, and stale entries (passing but baselined) exit 1.
          npx @modelcontextprotocol/conformance server \
            --url "$FIXTURE_URL" \
            --spec-version 2026-07-28 \
            --expected-failures conformance-baseline.yml \
            --verbose
          CONF_RC=$?

          # Capture fixture log for artifact.
          cat /tmp/fixture.log

          # Stop fixture.
          kill $FIXTURE_PID 2>/dev/null || true
          wait $FIXTURE_PID 2>/dev/null || true

          echo "Conformance exit code: $CONF_RC"
          exit $CONF_RC

      # Archive machine-readable results + fixture log as CI artifacts.
      - name: Upload conformance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-results
          path: |
            results/
            /tmp/fixture.log
          if-no-files-found: ignore
