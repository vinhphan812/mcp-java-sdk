name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  validate-docs:
    name: Validate Documentation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Validate Markdown tables and links
        run: python validate_docs.py

  build:
    strategy:
      matrix:
        java-version: ['11', '17']
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Build SDK classes
        run: ./gradlew jar --console=plain

      - name: Compile examples (CI gate)
        run: ./gradlew --no-daemon -p examples compileJava --console=plain

      - name: Test
        run: ./gradlew test --console=plain
      - name: Upload JAR artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mcp-java-sdk-artifacts
          path: build/libs/mcp-java-sdk-*.jar
          if-no-files-found: error

  dependency-security:
    name: SBOM and dependency vulnerability gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Generate CycloneDX SBOM
        run: ./gradlew cyclonedxBom --console=plain
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: cyclonedx-sbom
          path: build/reports/bom.json
          if-no-files-found: error
      # Install grype v0.97.1. The runner does not have it pre-installed.
      - name: Install grype SBOM scanner
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /tmp/grype-bin v0.97.1
          echo "/tmp/grype-bin" >> $GITHUB_PATH
      # grype v0.97.1 has NO --severity flag. Use --fail-on=high to filter:
      # --fail-on=high means HIGH/CRITICAL matches cause exit=1; MEDIUM/NEGLIGIBLE do NOT fail.
      # JSON output saved to file; python extracts and logs MEDIUM findings.
      - name: Report MEDIUM dependency vulnerabilities
        run: |
          grype "build/reports/bom.json" \
            --fail-on=high \
            -o json --file grype-all.json
          python3 -c '
            import json
            with open("grype-all.json") as f:
              data = json.load(f)
            medium = [m for m in data.get("matches", [])
                      if m.get("vulnerability", {}).get("severity", "").lower() == "medium"]
            print(f"MEDIUM findings ({len(medium)}):")
            for m in medium:
                v = m["vulnerability"]
                p = m["artifact"]
                fix = v.get("fix", {}).get("versions", ["n/a"])
                print(f"  {v[\"id\"]} | {p[\"name\"]}@{p[\"version\"]} | fix={fix}")
          '
        env:
          GRYPE_DB_AUTO_UPDATE: true
      # HIGH gate: --fail-on=high exits 1 only when HIGH/CRITICAL is found.
      # SARIF output is produced regardless; || ensures step succeeds if file exists.
      - name: Gate HIGH and CRITICAL dependency vulnerabilities
        run: |
          grype "build/reports/bom.json" \
            --fail-on=high \
            -o sarif \
            --file grype-results.sarif \
            || { test -f grype-results.sarif; }
      - name: Upload dependency scan SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: grype-results.sarif
