name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  validate-docs:
    name: Validate Documentation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Validate Markdown tables and links
        run: python validate_docs.py

  build:
    strategy:
      matrix:
        java-version: ['11', '17']
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Build SDK classes
        run: ./gradlew jar --console=plain

      - name: Compile examples (CI gate)
        run: ./gradlew --no-daemon -p examples compileJava --console=plain

      - name: Test
        run: ./gradlew test --console=plain
      - name: Upload JAR artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mcp-java-sdk-artifacts
          path: build/libs/mcp-java-sdk-*.jar
          if-no-files-found: error

  dependency-security:
    name: SBOM and dependency vulnerability gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Generate CycloneDX SBOM
        run: ./gradlew cyclonedxBom --console=plain
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: cyclonedx-sbom
          path: build/reports/bom.json
          if-no-files-found: error
      # Scan the Java dependency SBOM, not a container image. This non-blocking
      # pass keeps MEDIUM findings visible in the job log.
      - name: Report MEDIUM dependency vulnerabilities
        uses: anchore/scan-action@v6
        with:
          path: build/reports/bom.json
          fail-build: false
          severity-cutoff: medium
      # HIGH and CRITICAL findings block the workflow and create SARIF evidence.
      - name: Gate HIGH and CRITICAL dependency vulnerabilities
        uses: anchore/scan-action@v6
        with:
          path: build/reports/bom.json
          fail-build: true
          severity-cutoff: high
          output-format: sarif
          output-file: grype-results.sarif
      - name: Upload dependency scan SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: grype-results.sarif
