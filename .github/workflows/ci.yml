name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  validate-docs:
    name: Validate Documentation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Validate Markdown tables and links
        run: python validate_docs.py
      - name: Check stale class references in docs
        run: python docs_check_stale_classes.py

  build:
    strategy:
      matrix:
        java-version: ['11', '17']
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Build SDK classes
        run: ./gradlew jar --console=plain

      - name: Compile examples (CI gate)
        run: ./gradlew --no-daemon -p examples compileJava --console=plain

      - name: Test
        run: ./gradlew test --console=plain
      - name: Upload JAR artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mcp-java-sdk-artifacts
          path: build/libs/mcp-java-sdk-*.jar
          if-no-files-found: error

  dependency-security:
    name: SBOM and dependency vulnerability gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Generate CycloneDX SBOM
        run: ./gradlew cyclonedxBom --console=plain
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: cyclonedx-sbom
          path: build/reports/bom.json
          if-no-files-found: error
      # Install grype v0.97.1. The runner does not have it pre-installed.
      - name: Install grype SBOM scanner
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /tmp/grype-bin v0.97.1
          echo "/tmp/grype-bin" >> $GITHUB_PATH
      # NOTE: grype v0.97.1 only has --fail-on for severity gating (no --severity flag);
      # valid values: negligible | low | medium | high | critical.
      #
      # Step layout (all separate so one failure cannot suppress SARIF):
      # 1. Report findings (table + MEDIUM count) — non-blocking (--fail-on=high leaves MEDIUM at exit 0).
      # 2. Gate - block HIGH/CRITICAL per docs/SECURITY.md § Severity Policy.
      # 3. Generate SARIF - always succeeds (no --fail-on) so grype-results.sarif is produced
      #    even when findings are below threshold.
      # 4. Verify SARIF file exists and set an output so the upload runs only when present.
      # 5. Upload SARIF to GitHub code scanning — runs only if grype-results.sarif exists.
      - name: Scan SBOM - report MEDIUM findings
        run: |
          set +e
          # MEDIUM findings do not fail --fail-on=high; table shows HIGH+ findings.
          grype "build/reports/bom.json" --fail-on=high -o table
          # Count MEDIUM findings from grype JSON output for logging.
          grype "build/reports/bom.json" -o json | grep -c '"severity":"Medium"' || true
      - name: Gate - block HIGH or CRITICAL vulnerabilities
        run: |
          set +e
          # Exit 0 = clean; exit 1 = HIGH/CRITICAL found (per SECURITY.md § Severity Policy).
          grype "build/reports/bom.json" --fail-on=high
          rc=$?
          if [ $rc -eq 1 ]; then
            echo "HIGH or CRITICAL vulnerabilities detected - blocking build."
            exit 1
          fi
      - name: Generate SARIF for dependency scan
        if: always()
        run: |
          # No --fail-on: always exits 0 and writes grype-results.sarif, even when
          # findings are below threshold.
          grype "build/reports/bom.json" -o sarif --file grype-results.sarif
      - name: Check SARIF file exists
        if: always()
        id: sarif-check
        run: |
          if [ -f "grype-results.sarif" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "SARIF file exists, proceeding with upload"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "WARNING: grype-results.sarif not found"
          fi
      - name: Upload dependency scan SARIF
        if: always() && steps.sarif-check.outputs.exists == 'true'
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: grype-results.sarif
