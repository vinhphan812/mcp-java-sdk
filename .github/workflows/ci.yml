name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  validate-docs:
    name: Validate Documentation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Validate Markdown tables and links
        run: python validate_docs.py
      - name: Check stale class references in docs
        run: python docs_check_stale_classes.py

  build:
    strategy:
      matrix:
        java-version: ['11', '17']
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Build SDK classes
        run: ./gradlew jar --console=plain

      - name: Compile examples (CI gate)
        run: ./gradlew --no-daemon -p examples compileJava --console=plain

      - name: Test
        run: ./gradlew test --console=plain
      - name: Upload JAR artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mcp-java-sdk-artifacts
          path: build/libs/mcp-java-sdk-*.jar
          if-no-files-found: error

  dependency-security:
    name: SBOM and dependency vulnerability gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Generate CycloneDX SBOM
        run: ./gradlew cyclonedxBom --console=plain
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: cyclonedx-sbom
          path: build/reports/bom.json
          if-no-files-found: error
      # Install grype v0.97.1. The runner does not have it pre-installed.
      - name: Install grype SBOM scanner
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /tmp/grype-bin v0.97.1
          echo "/tmp/grype-bin" >> $GITHUB_PATH
      # NOTE: grype v0.97.1 only has --fail-on for severity gating (no --severity flag);
      # valid values: negligible | low | medium | high | critical.
      #
      # Step layout (all separate so one failure cannot suppress SARIF):
      # 1. Report findings (table + MEDIUM count) — non-blocking (--fail-on=high leaves MEDIUM at exit 0).
      # 2. Gate - block HIGH/CRITICAL per docs/SECURITY.md § Severity Policy.
      # 3. Generate SARIF - always succeeds (no --fail-on) so grype-results.sarif is produced
      #    even when findings are below threshold.
      # 4. Verify SARIF file exists and set an output so the upload runs only when present.
      # 5. Upload SARIF to GitHub code scanning — runs only if grype-results.sarif exists.
      - name: Scan SBOM - report MEDIUM findings
        run: |
          set +e
          # MEDIUM findings do not fail --fail-on=high; table shows HIGH+ findings.
          grype "build/reports/bom.json" --fail-on=high -o table
          # Count MEDIUM findings from grype JSON output for logging.
          grype "build/reports/bom.json" -o json | grep -c '"severity":"Medium"' || true
      - name: Gate - block HIGH or CRITICAL vulnerabilities
        run: |
          set +e
          # Exit 0 = clean; exit 1 = HIGH/CRITICAL found (per SECURITY.md § Severity Policy).
          grype "build/reports/bom.json" --fail-on=high
          rc=$?
          if [ $rc -eq 1 ]; then
            echo "HIGH or CRITICAL vulnerabilities detected - blocking build."
            exit 1
          fi
      - name: Generate SARIF for dependency scan
        if: always()
        run: |
          # No --fail-on: always exits 0 and writes grype-results.sarif, even when
          # findings are below threshold.
          grype "build/reports/bom.json" -o sarif --file grype-results.sarif
      - name: Check SARIF file exists
        if: always()
        id: sarif-check
        run: |
          if [ -f "grype-results.sarif" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "SARIF file exists, proceeding with upload"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "WARNING: grype-results.sarif not found"
          fi
      - name: Upload dependency scan SARIF
        if: always() && steps.sarif-check.outputs.exists == 'true'
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: grype-results.sarif

  # The official Node runner is CI-only tooling. The SDK remains Java-only at
  # build/runtime and this gate exercises Streamable HTTP, not STDIO.
  conformance:
    name: MCP 2026-07-28 conformance
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Download runtime JAR
        uses: actions/download-artifact@v4
        with:
          name: mcp-java-sdk-artifacts
          path: build/libs
      - name: Verify runtime JAR
        run: |
          set -eu
          jar=$(find build/libs -maxdepth 1 -name 'mcp-java-sdk-*.jar' -print -quit)
          test -n "$jar"
          echo "Conformance runtime JAR: $jar ($(stat -c%s "$jar") bytes)"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile fixture and write its runtime classpath
        run: ./gradlew --no-daemon -p examples compileJava conformanceClasspath --console=plain
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned conformance runner
        shell: bash
        run: |
          set -u
          mkdir -p .ci/conformance-npm
          install_runner() {
            npm install --prefix .ci/conformance-npm --no-save --no-audit --no-fund \
              @modelcontextprotocol/conformance@0.2.0-alpha.12 > npm-install.log 2>&1
          }
          if install_runner; then
            cat npm-install.log
            exit 0
          fi
          rc=$?
          cat npm-install.log >&2
          if grep -Eqi '(429|too many requests|rate limit|ECONNRESET|ECONNREFUSED|ETIMEDOUT|EAI_AGAIN|ENOTFOUND)' npm-install.log; then
            echo "Transient npm download failure; retrying once after 15 seconds."
            sleep 15
            install_runner
            rc=$?
            cat npm-install.log
            exit "$rc"
          fi
          echo "npm installation failed without a transient download/rate-limit signature; not retrying." >&2
          exit "$rc"
      - name: Run pinned conformance requirements
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p results
          cp_file=examples/build/conformance-classpath.txt
          test -s "$cp_file"
          fixture_log=results/fixture.log
          java -cp "$(cat "$cp_file")" io.github.vinhphan812.mcp.ConformanceFixture >"$fixture_log" 2>&1 &
          fixture_pid=$!
          cleanup() {
            kill "$fixture_pid" 2>/dev/null || true
            wait "$fixture_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          fixture_url=''
          for _ in $(seq 1 40); do
            fixture_url=$(sed -n 's/^CONFORMANCE_FIXTURE_URL=//p' "$fixture_log" | head -1)
            test -n "$fixture_url" && break
            if ! kill -0 "$fixture_pid" 2>/dev/null; then
              echo "Fixture exited before publishing its URL." >&2
              cat "$fixture_log" >&2
              exit 1
            fi
            sleep 0.5
          done
          test -n "$fixture_url" || { echo "Timed out waiting for fixture URL." >&2; cat "$fixture_log" >&2; exit 1; }
          echo "Fixture URL: $fixture_url"
          .ci/conformance-npm/node_modules/.bin/conformance server \
            --url "$fixture_url" \
            --requirements 2026-07-28 \
            --expected-failures conformance-baseline.yml \
            --output-dir results \
            --verbose
      - name: Upload conformance diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-results
          path: |
            results/
            npm-install.log
          if-no-files-found: warn
