name: MCP Interoperability CI

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      sdk_ref:
        description: 'SDK GitRef to test (branch, tag, or commit SHA)'
        required: false
        default: ''
  push:
    branches:
      - 'feature/mcp-2026-07-28-protocol'
  pull_request:
    branches:
      - master
      - 'feature/**'

env:
  PYTHON_VERSION: '3.11'
  SDK_BUILD_TIMEOUT_MINUTES: 10
  TEST_TIMEOUT_MINUTES: 15

jobs:
# ── Job 1: Build SDK JAR ────────────────────────────────────────────────────
  build-sdk:
    name: Build SDK (${{ matrix.java-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java-version: ['11', '17']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Build SDK JAR
        run: ./gradlew jar --console=plain -PsdkVersion=1.0.0-interop-test
      - name: Locate JARs
        run: ls -lh build/libs/
      - name: Upload SDK JAR
        uses: actions/upload-artifact@v4
        with:
          name: mcp-sdk-jar-java${{ matrix.java-version }}
          path: build/libs/mcp-java-sdk-1.0.0-interop-test.jar
          retention-days: 3

  # ── Job 2: Official MCP Conformance Tests ────────────────────────────────────
  conformance:
    name: MCP Conformance [${{ matrix.suite }}]
    runs-on: ubuntu-latest
    needs: build-sdk
    strategy:
      fail-fast: false
      matrix:
        suite: ['active', 'draft']
        include:
          - suite: 'active'
            spec_version: '2025-11-25'
          - suite: 'draft'
            spec_version: 'draft'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Download SDK JAR
        uses: actions/download-artifact@v4
        with:
          name: mcp-sdk-jar-java17
          path: build/libs/
      - name: Build SDK
        run: ./gradlew jar --console=plain
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Start SDK server (HTTP)
        run: |
          java -cp "build/libs/mcp-java-sdk-1.0.0-interop-test.jar" \
            io.github.vinhphan812.mcp.cmd.ConformanceHarness \
            > /tmp/server.log 2>&1 &
          SERVER_PID=$!
          echo $SERVER_PID > /tmp/server.pid
          for i in {1..30}; do
            if curl -s http://localhost:8080/mcp > /dev/null 2>&1; then
              echo "Server ready after $i seconds"
              break
            fi
            sleep 1
          done
      - name: Run MCP Conformance
        run: |
          set -o pipefail
          npx @modelcontextprotocol/conformance@latest server \
            --url http://localhost:8080/mcp \
            --suite ${{ matrix.suite }} \
            --spec-version ${{ matrix.spec_version }} \
            --expected-failures ./conformance-baseline.yml \
            --verbose 2>&1 | tee conformance-${{ matrix.suite }}.log
          echo "exit_code=$?" >> $GITHUB_OUTPUT
      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conformance-results-${{ matrix.suite }}
          path: conformance-${{ matrix.suite }}.log
          retention-days: 14
      - name: Display summary
        run: |
          echo "=== MCP Conformance (${{ matrix.suite }}) Summary ==="
          grep -E "(PASS|FAIL|passed|failed|error)" conformance-${{ matrix.suite }}.log | tail -20 || true
      - name: Stop server
        if: always()
        run: |
          if [ -f /tmp/server.pid ]; then
            kill $(cat /tmp/server.pid) 2>/dev/null || true
          fi

  # ── HTTP Interop and Matrix Report are deferred ────────────────────────────────
  # External interoperability testing (HTTP and matrix compilation) is deferred pending
  # a runnable harness implementation. The conformance tests above validate the SDK
  # against the official MCP specification test suite. HTTP interop and matrix
  # compilation jobs are removed from this workflow until a complete harness is available.
  # See GitHub issue #6 for tracking.

