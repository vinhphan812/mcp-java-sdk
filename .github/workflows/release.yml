name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write
  security-events: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Release provenance: verify commit SHA matches tag SHA ──
      - name: Verify commit SHA matches tag SHA
        run: |
          TAG_NAME="${GITHUB_REF_NAME#v}"
          TAG_SHA=$(git rev-parse "${GITHUB_REF}" 2>/dev/null)
          COMMIT_SHA=$(git rev-parse HEAD)

          echo "Tag: ${GITHUB_REF}"
          echo "Tag SHA: $TAG_SHA"
          echo "Commit SHA: $COMMIT_SHA"

          if [ "$TAG_SHA" != "$COMMIT_SHA" ]; then
            echo "ERROR: Tag SHA ($TAG_SHA) does not match commit SHA ($COMMIT_SHA)"
            echo "This may indicate a force-push or tag inconsistency."
            exit 1
          fi
          echo "SHA verification PASSED"

      # ── Release provenance: create annotated tag with metadata ──
      - name: Create annotated tag with provenance metadata
        run: |
          TAG_NAME="${GITHUB_REF_NAME#v}"
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          AUTHOR=$(git log -1 --format='%an <%ae>')

          # Create annotated tag with version, timestamp, author, commit SHA in message
          git tag -a "v${TAG_NAME}" -m "Release v${TAG_NAME}
          Timestamp: ${TIMESTAMP}
          Author: ${AUTHOR}
          Commit: ${GITHUB_SHA}
          "
          echo "Annotated tag created for v${TAG_NAME}"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release JAR, test, and generate CycloneDX SBOM
        run: ./gradlew -PsdkVersion=${GITHUB_REF_NAME#v} compileJava test build cyclonedxBom --console=plain

      - name: Compile examples (release gate)
        run: ./gradlew -p examples compileJava -PsdkJar=../build/libs/mcp-java-sdk-${GITHUB_REF_NAME#v}.jar --console=plain

      # anchore/scan-action@v6 accepts sbom=<file> for CycloneDX/JSON SBOM files.
      # path=<dir> fails because it treats the JSON file as a directory target.
      - name: Report MEDIUM dependency vulnerabilities
        uses: anchore/scan-action@v6
        with:
          sbom: build/reports/bom.json
          fail-build: false
          severity-cutoff: medium
      - name: Gate HIGH and CRITICAL dependency vulnerabilities
        uses: anchore/scan-action@v6
        with:
          sbom: build/reports/bom.json
          fail-build: true
          severity-cutoff: high
          output-format: table

      - name: Publish to GitHub Packages
        run: ./gradlew publish --console=plain
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            build/libs/mcp-java-sdk-*.jar
            build/reports/bom.json
