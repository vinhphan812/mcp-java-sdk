name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write
  security-events: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release JAR, test, and generate CycloneDX SBOM
        run: ./gradlew -PsdkVersion=${GITHUB_REF_NAME#v} compileJava test build cyclonedxBom --console=plain

      - name: Compile examples (release gate)
        run: ./gradlew -p examples compileJava -PsdkJar=../build/libs/mcp-java-sdk-${GITHUB_REF_NAME#v}.jar --console=plain

      # Grype consumes the Java dependency SBOM; no image or container scan is used.
      - name: Report MEDIUM dependency vulnerabilities
        uses: anchore/scan-action@v6
        with:
          path: build/reports/bom.json
          fail-build: false
          severity-cutoff: medium
      - name: Gate HIGH and CRITICAL dependency vulnerabilities
        uses: anchore/scan-action@v6
        with:
          path: build/reports/bom.json
          fail-build: true
          severity-cutoff: high
          output-format: sarif
          output-file: grype-results.sarif
      - name: Upload dependency scan SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: grype-results.sarif

      - name: Publish to GitHub Packages
        run: ./gradlew publish --console=plain
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            build/libs/mcp-java-sdk-*.jar
            build/reports/bom.json
